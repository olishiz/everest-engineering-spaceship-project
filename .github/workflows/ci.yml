name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spaceship
          POSTGRES_PASSWORD: spaceship
          POSTGRES_DB: spaceship_x26
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spaceship -d spaceship_x26"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: spaceship
      DATABASE_PASSWORD: spaceship
      DATABASE_NAME: spaceship_x26
      DATABASE_SYNCHRONIZE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:cov -- --runInBand
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run db:migrate
      - run: docker build .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
