services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spaceship
      POSTGRES_PASSWORD: spaceship
      POSTGRES_DB: spaceship_x26
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spaceship -d spaceship_x26']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    profiles: ['full']
    build: .
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: spaceship
      DATABASE_PASSWORD: spaceship
      DATABASE_NAME: spaceship_x26
      DATABASE_SYNCHRONIZE: 'false'
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  postgres_data:
